# Global project configuration for the DVC pipeline

dataset_url: "https://www.kaggle.com/datasets/rahmasleam/intel-image-dataset"
dataset_path: "data/raw"
processed_path: "data/processed"
artifacts_path: "artifacts"
processed_artifacts_path: "artifacts/processed"
features_path: "artifacts/features"
model_path: "artifacts/model"
metrics_path: "artifacts/metrics"

image_size:
  - 224
  - 224
batch_size: 32
epochs: 15
learning_rate: 0.0001
optimizer: "adam"
dropout_rate: 0.3
dense_units: 256
validation_split: 0.2
test_split: 0.1
rotation_range: 20
zoom_range: 0.2
horizontal_flip: true
brightness_range:
  - 0.8
  - 1.2
seed: 42
loss_function: "categorical_crossentropy"
metrics:
  - "accuracy"
  - "precision"
  - "recall"
model_name: "mobilenetv2_intel_classifier"
num_classes: 6
class_names:
  - "buildings"
  - "forest"
  - "glacier"
  - "mountain"
  - "sea"
  - "street"
freeze_base_model: true
fine_tune_at: 100
use_augmentation: true
